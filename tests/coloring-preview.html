<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>ぬりえ原画レビュー Ver.1.0 試作30</title>
  <style>
    :root {
      --bg: #f3faf7;
      --card: #ffffff;
      --ink: #24312b;
      --muted: #64736a;
      --line: #cfe2d7;
      --accent: #27795c;
      --soft: #eaf7f0;
      --shadow: 0 8px 22px rgba(38, 83, 61, .1);
    }
    * { box-sizing: border-box; }
    html, body { max-width: 100%; overflow-x: hidden; }
    body {
      margin: 0;
      padding: 20px max(16px, env(safe-area-inset-right)) calc(24px + env(safe-area-inset-bottom)) max(16px, env(safe-area-inset-left));
      background: var(--bg);
      color: var(--ink);
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    header { max-width: 1180px; margin: 0 auto 18px; }
    h1 { margin: 0 0 8px; font-size: clamp(1.45rem, 5vw, 2rem); }
    p { line-height: 1.6; }
    .note { margin: 0; color: var(--muted); }
    .toolbar {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-top: 16px;
    }
    button {
      min-height: 48px;
      border: 1px solid #92b9a5;
      border-radius: 12px;
      padding: 10px 16px;
      background: #fff;
      color: var(--ink);
      font: inherit;
      font-weight: 800;
      cursor: pointer;
    }
    button[aria-pressed="true"] { background: var(--accent); color: #fff; border-color: var(--accent); }
    button:focus-visible { outline: 3px solid #f5bf42; outline-offset: 2px; }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(min(100%, 340px), 1fr));
      gap: 16px;
      max-width: 1180px;
      margin: 0 auto;
    }
    .card {
      min-width: 0;
      border: 1px solid var(--line);
      border-radius: 16px;
      padding: 14px;
      background: var(--card);
      box-shadow: var(--shadow);
    }
    .card-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 10px; }
    .card h2 { margin: 0; font-size: 1.18rem; overflow-wrap: anywhere; }
    .badges { display: flex; flex-wrap: wrap; justify-content: flex-end; gap: 6px; }
    .badge {
      display: inline-block;
      border-radius: 999px;
      padding: 4px 8px;
      background: var(--soft);
      color: var(--accent);
      font-size: .78rem;
      font-weight: 800;
      white-space: nowrap;
    }
    .comparison {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 10px;
      margin-top: 12px;
    }
    .preview {
      min-width: 0;
      min-height: 154px;
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 8px;
      background: #fff;
    }
    .preview-label { margin: 0 0 5px; color: var(--muted); font-size: .76rem; font-weight: 800; }
    .preview svg { display: block; width: 100%; height: 118px; margin: auto; }
    .size-check {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 10px;
      align-items: end;
      margin-top: 10px;
    }
    .size-box {
      min-width: 0;
      min-height: 146px;
      border: 1px dashed #a8c7b7;
      border-radius: 12px;
      padding: 8px;
      background: #fafffc;
      text-align: center;
    }
    .size-box svg { display: block; margin: 5px auto 0; }
    .size-80 svg { width: 80px; height: 80px; }
    .size-120 svg { width: 120px; height: 120px; max-width: 100%; }
    .silhouette .color-region { fill: #111827 !important; }
    .silhouette .outer-outline, .silhouette .inner-lines, .silhouette .face-details { display: none; }
    .ids {
      margin: 10px 0 0;
      color: var(--muted);
      font-size: .76rem;
      overflow-wrap: anywhere;
    }
    .aliases { margin-top: 6px; }
    body.hide-names .card-head h2 { visibility: hidden; }
    @media (max-width: 410px) {
      body { padding-top: 14px; }
      .comparison { grid-template-columns: 1fr; }
      .preview { min-height: 166px; }
      .preview svg { height: 130px; }
      .card-head { display: block; }
      .badges { justify-content: flex-start; margin-top: 8px; }
    }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { scroll-behavior: auto !important; transition: none !important; animation: none !important; }
    }
  </style>
  <script src="../js/constants.js?v=10p30"></script>
  <script src="../js/coloring-art-v30.js?v=10p30"></script>
  <script src="../js/coloring.js?v=10p30"></script>
</head>
<body>
  <header>
    <h1>ぬりえ原画レビュー Ver.1.0 試作30</h1>
    <p class="note">刷新対象7種だけを、旧原画と新原画で比較します。本番localStorageは使用しません。</p>
    <div class="toolbar" aria-label="レビュー表示設定">
      <button type="button" id="toggle-names" aria-pressed="true">鳥・どうぶつ名を表示</button>
    </div>
  </header>
  <main id="preview-root" class="grid"></main>
  <script>
    (function () {
      "use strict";

      var KA = window.KodomoAdventure;
      var root = document.getElementById("preview-root");
      var nameToggle = document.getElementById("toggle-names");
      var targetIds = KA.coloringArtV30.targetIds.slice();
      var palette = ["#7CC7A5", "#F5C85B", "#F49A78", "#80B8E6", "#C5A5DF", "#F4B9CF", "#A7D86F", "#F1D8A8"];

      function templateById(templateId) {
        return KA.constants.COLORING_TEMPLATES.filter(function (template) {
          return template.templateId === templateId;
        })[0];
      }

      function sampleColors(template, offset) {
        var colors = {};
        template.regionIds.forEach(function (regionId, index) {
          colors[regionId] = palette[(index + offset) % palette.length];
        });
        return colors;
      }

      function esc(value) {
        return String(value == null ? "" : value)
          .replace(/&/g, "&amp;")
          .replace(/</g, "&lt;")
          .replace(/>/g, "&gt;")
          .replace(/"/g, "&quot;");
      }

      function renderDefinition(definition, label, colors, className) {
        var fills = colors || {};
        return [
          '<svg viewBox="' + esc(definition.viewBox) + '" role="img" aria-label="' + esc(label) + '" class="' + esc(className || "") + '">',
          '<g class="color-regions">',
          definition.regions.map(function (region) {
            return '<path class="color-region" data-region-id="' + esc(region.id) + '" d="' + esc(region.d) + '" fill="' + esc(fills[region.id] || region.fallback || "#FFFFFF") + '"/>';
          }).join(""),
          '</g>',
          '<g class="outer-outline" fill="none" stroke="#1F2937" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round" pointer-events="none">',
          definition.outer.map(function (path) { return '<path d="' + esc(path) + '"/>'; }).join(""),
          '</g>',
          '<g class="inner-lines" fill="none" stroke="#2F3A42" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" pointer-events="none">',
          definition.inner.map(function (line) { return '<path d="' + esc(line.d || line) + '"/>'; }).join(""),
          '</g>',
          '<g class="face-details" pointer-events="none">' + (definition.face || "") + '</g>',
          '</svg>'
        ].join("");
      }

      root.innerHTML = targetIds.map(function (templateId, index) {
        var template = templateById(templateId);
        var oldDefinition = KA.coloring.getLegacyLayeredDefinition(templateId);
        var newDefinition = KA.coloring.getLayeredDefinition(templateId);
        var lineSvg = KA.coloring.renderTemplate(templateId, {}, "review-svg");
        var sampleSvg = KA.coloring.renderTemplate(templateId, sampleColors(template, index), "review-svg");
        var legacySvg = renderDefinition(oldDefinition, template.title + "の旧原画", {}, "review-svg");
        var silhouetteSvg = KA.coloring.renderTemplate(templateId, {}, "review-svg");
        return [
          '<section class="card" data-template-id="' + esc(templateId) + '">',
          '<div class="card-head">',
          '<h2>' + esc(template.icon + " " + template.title) + '</h2>',
          '<div class="badges"><span class="badge">designVersion ' + template.designVersion + '</span><span class="badge">' + template.regionIds.length + '領域</span></div>',
          '</div>',
          '<div class="comparison">',
          '<div class="preview legacy"><p class="preview-label">旧原画</p>' + legacySvg + '</div>',
          '<div class="preview"><p class="preview-label">新原画・未着色線画</p>' + lineSvg + '</div>',
          '<div class="preview silhouette"><p class="preview-label">新原画・黒シルエット</p>' + silhouetteSvg + '</div>',
          '<div class="preview"><p class="preview-label">新原画・サンプル着色</p>' + sampleSvg + '</div>',
          '</div>',
          '<div class="size-check">',
          '<div class="size-box size-80"><p class="preview-label">80px</p>' + sampleSvg + '</div>',
          '<div class="size-box size-120"><p class="preview-label">120px</p>' + sampleSvg + '</div>',
          '</div>',
          '<p class="ids">regionIds: ' + esc(template.regionIds.join(", ")) + '</p>',
          '<p class="ids aliases">regionAliases: ' + esc(JSON.stringify(template.regionAliases || {})) + '</p>',
          '</section>'
        ].join("");
      }).join("");

      nameToggle.addEventListener("click", function () {
        var namesVisible = nameToggle.getAttribute("aria-pressed") !== "true";
        nameToggle.setAttribute("aria-pressed", namesVisible ? "true" : "false");
        nameToggle.textContent = namesVisible ? "鳥・どうぶつ名を表示" : "鳥・どうぶつ名を非表示";
        document.body.classList.toggle("hide-names", !namesVisible);
      });
    })();
  </script>
</body>
</html>
